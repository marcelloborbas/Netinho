name: Publicar função de senhas no Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/set-representative-password/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar função no projeto configurado
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure o segredo SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy set-representative-password --project-ref ajopipjydbphhwgtjfki
