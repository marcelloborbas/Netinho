name: Implantar senha dos representantes no Supabase

# Desativado: função legada usa user_roles inexistente e e-mails de teste.
# Não publicar automaticamente até revisão de autenticação.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gmxojviqhpyqsaceftpb
    steps:
      - name: Verificar credencial de implantacao
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN nos Secrets do repositorio."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Implantar funcao de senha
        run: supabase functions deploy set-representative-password --project-ref "$PROJECT_REF"

# Implantar no mesmo projeto configurado em VITE_SUPABASE_URL.
