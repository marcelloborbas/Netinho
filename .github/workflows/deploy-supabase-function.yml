name: Implantar senha dos representantes no Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/set-representative-password/**'
      - '.github/workflows/deploy-supabase-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ajopipjydbphhwgtjfki
    steps:
      - name: Verificar credencial de implantacao
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN nos Secrets do repositorio."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Implantar funcao de senha
        run: supabase functions deploy set-representative-password --project-ref "$PROJECT_REF"

# Implantar no mesmo projeto configurado em VITE_SUPABASE_URL.
