<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia por dispositivo · Netinho</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101218;color:#f5f5f7;font:14px system-ui,sans-serif}header{padding:20px 24px;background:#1b1e26;border-bottom:1px solid #ffffff18}h1{font-size:20px;margin:0 0 6px}p{margin:0;color:#b8c0cf;line-height:1.6}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,a{font:inherit;border:1px solid #ffffff26;border-radius:24px;padding:10px 16px;background:#242833;color:white;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#b91c1c;border-color:#ef4444}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}main{padding:24px 12px;overflow:hidden}.meta{text-align:center;margin-bottom:14px;color:#aeb7c8}.stage{margin:auto;position:relative}.device{position:absolute;top:0;left:0;transform-origin:top left;background:#0e0f11;border:8px solid #353b48;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px #0008}iframe{display:block;border:0;background:#0e0f11;width:100%;height:100%}.note{text-align:center;max-width:620px;margin:20px auto;padding:0 12px;font-size:12px}
</style>
</head>
<body><header><h1>Netinho · Prévia por dispositivo</h1><p>Veja a página real em três tamanhos de tela. Use a rolagem dentro da moldura.</p><nav class="controls" aria-label="Dispositivo"><button data-device="mobile" aria-pressed="true">Celular</button><button data-device="tablet" aria-pressed="false">Tablet</button><button data-device="laptop" aria-pressed="false">Laptop</button><a href="/" target="_blank" rel="noopener">Abrir em tela inteira ↗</a></nav></header><main><div class="meta" id="dimensions" aria-live="polite"></div><div class="stage"><div class="device"><iframe src="/" title="Site Netinho no dispositivo selecionado"></iframe></div></div><p class="note">Simulação do tamanho da tela. A aparência pode variar conforme o navegador e o aparelho. O login Google deve ser aberto em tela inteira.</p></main>
<script>
const sizes={mobile:[360,640,'Celular'],tablet:[820,1180,'Tablet'],laptop:[1366,900,'Laptop']};let current='mobile';
function render(){const [w,h,label]=sizes[current],outerW=w+16,outerH=h+16;const scale=Math.min(1,(document.documentElement.clientWidth-32)/outerW);const device=document.querySelector('.device'),stage=document.querySelector('.stage');device.style.width=outerW+'px';device.style.height=outerH+'px';device.style.transform=`scale(${scale})`;stage.style.width=outerW*scale+'px';stage.style.height=outerH*scale+'px';document.querySelector('#dimensions').textContent=`${label} · ${w} × ${h} px · visualização ${Math.round(scale*100)}%`;document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===current)));}
document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.device;render()}));window.addEventListener('resize',render);render();
</script></body></html>
